# --- Foot Configuration (Optimizada) ---

[main]
font=FiraCode Nerd Font:size=14
pad=10x10
shell=zsh
term=foot
initial-window-size-chars=80x24
selection-target=clipboard

[scrollback]
lines=5000

[cursor]
style=block
blink=no

[mouse]
hide-when-typing=yes

[security]
osc52=enabled

[colors-dark]
alpha=0.98
background=101418
foreground=e0e2e8
selection-foreground=243240
selection-background=b9c8da
urls=9dcbfb

# Paleta base
regular0=101418
regular1=d75a59
regular2=8ed88c
regular3=e0d99d
regular4=4087bc
regular5=839fbc
regular6=9dcbfb
regular7=abb2bf

# Colores brillantes
bright0=5c6370
bright1=e57e7e
bright2=a2e5a0
bright3=efe9b3
bright4=a7d9ff
bright5=3d8197
bright6=5c7ba3
bright7=ffffff

[key-bindings]
spawn-terminal=Control+Shift+n
font-increase=Control+plus Control+equal Control+KP_Add
font-decrease=Control+minus Control+KP_Subtract
font-reset=Control+0 Control+KP_0
