timeout 20
use_nvram false

extra_kernel_version_strings "linux-cachyos,linux-cachyos-lts,linux-hardened,linux-zen,linux-lts,linux"

use_graphics_for linux, windows

scanfor manual
include /EFI/refind/themes/refind-black/theme.conf

menuentry "Arch Linux" {
	icon	/EFI/refind/themes/refind-black/icons/os_arch.png
	volume	"0e1a9f5d-df68-4f8b-ad4a-53c0a2bc95ef"
	ostype	Linux
	loader	/vmlinuz-linux-cachyos
	initrd	/initramfs-linux-cachyos.img 
	options	"rw root=UUID=702e821f-a5bc-49d1-b6f2-dc8d6ea2b4c6 rootflags=subvol=@ rootfstype=btrfs quiet nowatchdog transparent_hugepage=madvise mitigations=off loglevel=3 nvme_core.default_ps_max_latency_us=5500 tsc=reliable clocksource=tsc 8250.nr_uarts=0 zswap.enabled=0"
}

menuentry "Windows" {
	icon	/EFI/refind/themes/refind-black/icons/os_win.png
	ostype	Windows
	loader	/EFI/Microsoft/Boot/bootmgfw.efi
}
