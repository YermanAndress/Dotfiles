# /etc/mkinitcpio.conf - Configuración para PC Host (CachyOS / Arch Linux)

# MODULES: Módulos del kernel cargados en el arranque temprano (ej: amdgpu, nvidia, btrfs)
MODULES=()

# BINARIES: Binarios adicionales e independientes incluidos en el initramfs
BINARIES=()

# FILES: Archivos de configuración o firmware incluidos tal cual
FILES=()

# HOOKS: Scripts de inicialización ejecutados en el proceso de arranque
HOOKS=(base udev autodetect microcode modconf kms keyboard keymap block filesystems fsck)

# COMPRESSION: Algoritmo de compresión (zstd es el predeterminado)
# COMPRESSION="zstd"
